name: Cotización E2E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build y compatibilidad app/Edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalizar bun.lock (registro privado de Lovable)
        run: sed -i -E 's#"https://europe-west[0-9]+-npm\.pkg\.dev/lovable-core-prod/[^"]*"#""#g' bun.lock
      - run: bun install --frozen-lockfile
      - name: TypeScript de la app
        run: bunx tsc --noEmit
      - name: Alias de Vitest — HTML, PDF y constructor
        run: bunx vitest run src/lib/quotes/proposal.test.ts src/lib/pdf/proposal-document.test.tsx src/components/quote/proposal-builder.test.tsx --maxWorkers=1
      - name: Build de producción con el plugin de Vite
        run: bun run build
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_ID: uyuni-quote-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalizar bun.lock (registro privado de Lovable)
        run: sed -i -E 's#"https://europe-west[0-9]+-npm\.pkg\.dev/lovable-core-prod/[^"]*"#""#g' bun.lock
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.e2e.json
      - name: Sugerencias y creación de plantillas (T01)
        run: bunx vitest run src/lib/quotes/suggestions.test.ts src/lib/quotes/creation.test.ts src/components/quote/quote-creator.test.tsx --maxWorkers=1
      - name: Matriz de permisos RLS
        run: bun --no-env-file run test:roles
      - name: Perfiles de prueba y emails de Admin (PGlite)
        run: bunx vitest run src/lib/admin/users.test.ts --maxWorkers=1
      - name: Revisión de textos, PDF y estados (PGlite)
        run: bunx vitest run src/lib/quotes/text-review.test.ts src/lib/quotes/days.test.ts src/lib/states/states.test.ts src/lib/pdf/pdf.test.tsx --maxWorkers=1
      - name: Flujo básico y catálogo realista (T01s)
        run: bunx vitest run src/lib/quotes/stabilization.test.ts src/lib/pricing/rate-error.test.ts --maxWorkers=1 --silent=false
      - name: Guardado de plantillas — SKU, permisos y diálogo (T01g)
        run: bunx vitest run src/lib/quotes/save-template.test.ts src/components/quote/save-template-dialog.test.tsx --maxWorkers=1
      - name: Constructor de propuesta, HTML y PDF (T13)
        run: bunx vitest run src/lib/quotes/document-sections-migration.test.ts src/components/quote/quote-workspace.test.tsx src/lib/quotes/proposal.test.ts src/lib/pdf/proposal-document.test.tsx src/components/quote/proposal-builder.test.tsx src/components/quote/quote-delivery.test.tsx --maxWorkers=1
      - name: Documento atómico, RLS y congelado (T13)
        run: node scripts/db/test-proposals.mjs
      - name: Borrado y aprobacion de catalogo con PGlite (T01u/T01k)
        run: bunx vitest run src/lib/catalog --maxWorkers=1
      - run: bunx playwright install --with-deps chromium
      - run: node tests/e2e/prepare-functions.mjs
      - name: Supabase aislado (sin conexión a Cloud)
        run: bun --no-env-file x supabase start --workdir tests/e2e
      - run: bun --no-env-file run e2e:setup
      - name: Email simulado, handler y RPC reales
        run: |
          bun --no-env-file x supabase functions serve send-quote-email --workdir tests/e2e --env-file tests/e2e/.local/functions.env > /tmp/e2e-edge.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail -X OPTIONS http://127.0.0.1:54321/functions/v1/send-quote-email; then exit 0; fi
            sleep 2
          done
          cat /tmp/e2e-edge.log
          exit 1
      - name: Playwright — dos repeticiones, sin reintentos
        run: bun --no-env-file run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Logs Edge en caso de fallo
        if: failure()
        run: cat /tmp/e2e-edge.log || true
      - name: Limpiar entorno efímero
        if: always()
        run: bun --no-env-file x supabase stop --workdir tests/e2e --no-backup
